name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          filters: |
            # ghalint / jactionlint の検査対象（と、その設定）だけを見る。.github/ 配下でも CODEOWNERS や release.yml などでは走らせない。
            workflows:
              - '.github/workflows/**'
              - '**/action.yml'
              - '**/action.yaml'
              - '.github/jactionlint.yaml'
              - '.github/jactionlint.yml'
              - '.ghalint.yaml'
              - '.ghalint.yml'
              - 'ghalint.yaml'
              - 'ghalint.yml'
              - '.github/ghalint.yaml'
              - '.github/ghalint.yml'

  check-actions-security:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: yagihash/actions/check-actions-security@9f208d1c7c8bdccc9fb897307a18b15375ee5000 # v0.2.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: go test
        run: go test -v -cover -race ./...

  # The one check that a ruleset requires. Every job above is in `needs`: it fails when one of them failed or was cancelled, and passes
  # when they passed or were skipped (no workflow changed). A job added above has to be added here.
  ci-ok:
    if: always()
    needs: [changes, check-actions-security, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: yagihash/actions/ci-ok@b2075301726190d59d2cf57e54d62700c55ae134 # v0.1.0
        with:
          needs: ${{ toJSON(needs) }}
          filter-job: changes
          filter-outputs: workflows
