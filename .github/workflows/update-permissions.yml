name: "Update GitHub App permissions"

on:
  schedule:
    - cron: "0 9 * * 1" # every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      UPDATE_BRANCH: chore/update-permissions

    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: go generate
        run: go generate ./internal/webhook/...

      - name: Get ghmint token
        id: ghmint
        uses: yagihash/ghmint-action@be57533eef7f69550d06f0c93eede5589158281a # v1.0.0
        with:
          scope: ${{ github.repository }}
          policy: update-permissions

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- internal/webhook/permissions_gen.go; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete stale update branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.ghmint.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${UPDATE_BRANCH}" || true

      - name: Create signed commit
        if: steps.diff.outputs.changed == 'true'
        uses: yagihash/actions/signed-commit@75a36e929a30f99149784465dcdf9d33ab01a120 # v0.0.4
        with:
          token: ${{ steps.ghmint.outputs.token }}
          branch: ${{ env.UPDATE_BRANCH }}
          message: "chore: update GitHub App permissions from OpenAPI spec"
          files: internal/webhook/permissions_gen.go

      - name: Create pull request
        id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: yagihash/actions/create-pull-request@75a36e929a30f99149784465dcdf9d33ab01a120 # v0.0.4
        with:
          token: ${{ steps.ghmint.outputs.token }}
          title: "chore: update GitHub App permissions from OpenAPI spec"
          body: |
            Regenerated `internal/webhook/permissions_gen.go` from the GitHub REST API OpenAPI spec.

            - Source: `components/schemas/app-permissions`
            - Generator: `tools/gen-permissions`
          head: ${{ env.UPDATE_BRANCH }}
          base: main

      - name: Write summary
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [[ "$CHANGED" == "true" ]]; then
            {
              echo "## Update GitHub App permissions"
              echo ""
              echo "Changes detected. A pull request has been created or updated."
              echo ""
              echo "**Pull Request:** $PR_URL"
              echo ""
              echo "### Diff"
              echo '```diff'
              git diff -- internal/webhook/permissions_gen.go
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Update GitHub App permissions"
              echo ""
              echo "No changes detected. \`permissions_gen.go\` is already up to date."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
